<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>실시간 금값 시세</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #fff;
      padding: 12px;
      box-sizing: border-box;
    }
    .widget-container {
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 16px;
      background-color: #fafafa;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      max-width: 360px;
      font-size: 14px;
    }
    .widget-title {
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .update-time {
      margin-top: 10px;
      font-size: 11px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <div class="widget-title">📈 실시간 금값 시세</div>
    <div id="price">불러오는 중...</div>
    <div class="update-time" id="time"></div>
  </div>

  <script>
    async function loadGold() {
      try {
        const [goldRes, fxRes] = await Promise.all([
          fetch('https://api.metals.live/v1/spot/gold'),
          fetch('https://api.exchangerate-api.com/v4/latest/USD')
        ]);

        const gold = await goldRes.json();
        const fx = await fxRes.json();

        const goldUSD = gold[0].price;
        const usdToKrw = fx.rates.KRW;
        const perGram = (goldUSD / 31.1035) * usdToKrw;
        const perDon = perGram * 3.75;

        document.getElementById('price').innerHTML = `
          💰 국제 금: <b>$${goldUSD.toFixed(2)}</b> / oz<br>
          💱 환율: <b>${usdToKrw.toFixed(2)}원</b><br>
          🪙 원화: <b>${perGram.toFixed(0)}원/g</b>, <b>${perDon.toFixed(0)}원/돈</b>
        `;
        document.getElementById('time').textContent = `⏱️ ${new Date().toLocaleString()}`;
      } catch (e) {
        document.getElementById('price').textContent = '정보를 불러오지 못했습니다.';
      }
    }

    loadGold();
  </script>
</body>
</html>
