<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gold Price Widget</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="gold-widget">
    <h2>📈 실시간 금값 (1g)</h2>
    <div class="price" id="gold-price">로딩 중...</div>
    <p class="update-time" id="update-time"></p>
  </div>

  <script>
    async function fetchGoldPrice() {
      try {
        const response = await fetch('https://api.metals.live/v1/spot/gold');
        const data = await response.json();
        const usdPrice = data[0][1];
        const exchangeRate = 1350;
        const krwPerGram = Math.round((usdPrice / 31.1035) * exchangeRate);

        document.getElementById("gold-price").innerText = krwPerGram.toLocaleString() + "원";
        document.getElementById("update-time").innerText = "업데이트: " + new Date().toLocaleString();
      } catch (e) {
        document.getElementById("gold-price").innerText = "데이터를 불러올 수 없습니다.";
      }
    }

    fetchGoldPrice();
    setInterval(fetchGoldPrice, 300000);
  </script>
</body>
</html>
